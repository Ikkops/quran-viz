<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Paper token (DESIGN.md); ThemeContext keeps it in step with the app's own dark toggle. -->
    <meta name="theme-color" content="#F7F8F5" />
    <!-- App icon: scripts/build_icons.py (اِقْرَأْ, lapis + rubric marks). -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Qurani</title>
    <!-- Fonts are self-hosted (src/fonts.ts) so the Android app works offline. -->
    <!-- The core data (data/useQuranData.ts) downloads while the code parses. -->
    <link rel="preload" href="data/verses-cols.json" as="fetch" crossorigin />
    <link rel="preload" href="data/surahs.json" as="fetch" crossorigin />
    <link rel="preload" href="data/editions.json" as="fetch" crossorigin />
    <link rel="preload" href="data/meta.json" as="fetch" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
