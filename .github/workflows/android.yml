name: Android APK

# Pull requests: build a signed APK and attach it to the run (to try before merging).
# Pushes to main: build it and publish a GitHub Release, which Obtainium on the
# tablet picks up as an update.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test # a release that fails them is never published
      - run: npm run build:android # dist/ with data, minus the tafsirs the app downloads
        env:
          # A release downloads tafsir and word timings from its own commit
          # (src/data/tafsirStore.ts); a pull request's APK from main.
          VITE_DATA_REF: ${{ github.event_name == 'push' && github.sha || 'main' }}
      - run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "quran-viz-1.0.${APP_VERSION_CODE}.apk"
          ls -lh quran-viz-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quran-viz-apk
          path: quran-viz-*.apk
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${APP_VERSION_CODE}" quran-viz-*.apk \
            --target "$GITHUB_SHA" \
            --title "Quran Viz 1.0.${APP_VERSION_CODE}" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
